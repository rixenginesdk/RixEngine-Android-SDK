<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>广告信息二维码</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://code.jquery.com/jquery-4.1.0.min.js"></script>
        <script src="https://cdn.staticfile.org/jquery.qrcode/1.0/jquery.qrcode.min.js"></script>
    </head>
    <body>
        <div id="service_body">
            <div id="service_theme">
                <h1 id="service_title">广告配置生成二维码</h1>
                <div id="qrcode"></div>
            </div>
  
            <div id="box">
                <div id="title">
                    <label class="label">请输入文本：【json 或 key=value】</label>
                    <button type="button" id="template1" class="button">key-value数据模版</button>
                    <button type="button" id="template2" class="button">json数据模版</button>
                    <button type="button" id="format" class="button">json格式化</button>
                </div>
                <textarea rows="10" cols="100" id="textarea" placeholder="请输入内容:例如："></textarea>
                <button type="button" id="submit">生成二维码</button>
                <div id="msg"></div>
            </div>
        </div>
    </body>
</html>
<script type="text/javascript">
    function isEmpty(str){
        if(str==null || str==undefined){
            return true;
        }
        str=str.trim();
        if(str.length<1){
            return true;
        }
        return false;
    }
    function isJSON(str) {
        if (typeof str == 'string') {
            try {
                var obj=JSON.parse(str);
                if(typeof obj == 'object' && obj ){
                    return true;
                }else{
                    return false;
                }
    
            } catch(e) {
                return false;
            }
        }else{
            return false;
        }
    }

    function isNumber(val){
        var regPos = /^\d+(\.\d+)?$/; 
        var regNeg = /^(-(([0-9]+\.[0-9]*[1-9][0-9]*)|([0-9]*[1-9][0-9]*\.[0-9]+)|([0-9]*[1-9][0-9]*)))$/; 
        if(regPos.test(val) || regNeg.test(val)){
            return true;
        }else{
            return false;
        }    
    }

    function formatJson(jsonStr){
      if(!isEmpty(jsonStr) && isJSON(jsonStr)){
        var jsonObj=JSON.parse(jsonStr);
        var jsonFormat=JSON.stringify(jsonObj,null,4);
        return jsonFormat;
      }
      return jsonStr;
    }
</script>
<script type="text/javascript">


// key-value数据模版: 有值。正式上线不推荐使用这个(供开发使用)。推荐用无值的模板
    var template1="host==\r\n";
    template1+="appid==\r\n";
    template1+="token==\r\n";
    template1+="sid==\r\n";
    template1+="banner==\r\n";
    template1+="native==\r\n";
    template1+="rewardVideo==\r\n";
    template1+="interstitialVideo==\r\n";
    template1+="interstitialBanner==\r\n";
    template1+="splashVideo==\r\n";
    template1+="splashBanner==\r\n";
    template1+="bundle==\r\n";
    template1+="debug==true\r\n";
  
  
    var templateJson='{"host":"","appid":"","token":"","sid":"","banner":"","native":"","rewardVideo":"","interstitialVideo":"","interstitialBanner":"","splashVideo":"","splashBanner":"","bundle":"","debug":true}';
  
    var placeholder="内容格式如下\r\n";
    placeholder+="方式一：\r\n";
    placeholder+=template1;
    placeholder+="方式二：\r\n";
    placeholder+=formatJson(templateJson);
    $("#textarea").attr({"placeholder":placeholder});
  
    $("#template1").on("click",function(){
      $("#textarea").val(template1);
    });
  
    $("#template2").on("click",function(){
      var jsonFormat=formatJson(templateJson);
      $("#textarea").val(jsonFormat);
    });
  
  
  
    $("#format").on("click",function(){
      var value=$("#textarea").val();
      if(isEmpty(value) || !isJSON(value)){
        return;
      }
      var jsonObj=JSON.parse(value);
      var jsonFormat=JSON.stringify(jsonObj,null,"");
  
      jsonObj=JSON.parse(jsonFormat);
      jsonFormat=JSON.stringify(jsonObj,null,4);
      $("#textarea").val(jsonFormat);
    });


    $("#submit").on("click",function(){
      var params=$("#textarea").val();
      if(isEmpty(params)){
        alert("请输入内容");
        return;
      }
  
      var paramsValue="";
      if(isJSON(params)){
        var json=JSON.parse(params);
        paramsValue=JSON.stringify(json);
        // console.log(paramsValue);
        sendMessage(paramsValue);
      }else{
        var arr=params.split("\n");
        var jsonObj={};
        if(arr!=null && arr.length>0){
          for(var i=0;i<arr.length;i++){
            var item=arr[i];
            item=item.trim();
            if(isEmpty(item)){
              continue;
            }
            console.log(item);
            var keyValue=item.split("==");
            if(keyValue!=null && keyValue.length==2){
              var key = keyValue[0];
              var value = keyValue[1];
              key=key.trim();
              value=value.trim();
              if(isEmpty(key) || isEmpty(value)){
                continue;
              }
              
              var temp = value;
              var charValue = value.toLowerCase();
              if(charValue == "true" || charValue == "false"){
                temp = charValue === "true" ? true : false;
              }else if(charValue == "null"){
                temp = null;
              }
            //   else if(isNumber(value)){
            //     temp=Number(value);
            //   }
              else{
                temp=value;
              }          
              jsonObj[key]=temp;
            }else{
              console.log("key-value 格式错误");
            }
          }
        }

        if(Object.keys(jsonObj).length < 1 ){
          alert("请输入key-value数据");
          return;
        }
        paramsValue=JSON.stringify(jsonObj);
        // console.log(paramsValue);
        sendMessage(paramsValue);
        
      }
    });

    function sendMessage(message) {
        console.log(message);
        $("#msg").text(message);
        var $qr = $("#qrcode");
        $qr.empty();    
        $qr.qrcode({
            render:"canvas",
            width:300,
            height:300,
            background:"#ffffff",
            foreground:"#000000",
            correctLevel : 1,
            text:message
        });
    }

</script>
